# Overlay de ambiente LOCAL (desarrollo) — usar junto con compose.yml:
#   docker compose --env-file .env.local -f compose.yml -f compose.local.yml up -d
# Relacionado con: docs/03-diseno/despliegue/estrategia-ambientes.md §4
#
# Puertos publicados solo en 127.0.0.1 (no expuestos a la red), modelo LLM pequeño,
# límites de recursos bajos, volúmenes nombrados (efímeros), perfil "observabilidad" opcional
# para Prometheus/Grafana/Langfuse (docker compose ... --profile observabilidad up -d).
#
# Puertos 8443/5433/9010-9011 (en vez de 443/5432/9000-9001): esta máquina de desarrollo
# ya tiene otros proyectos Docker corriendo que ocupan esos puertos por defecto.

networks:
  red_interna:
    internal: false   # en local SÍ hay internet (para `ollama pull`, `pip install`, etc.);
                       # en stage se mantiene internal: true (RNF-01) — ver compose.stage.yml.

services:

  proxy:
    env_file: ../.env.local
    ports:
      - "127.0.0.1:8443:443"
    # TLS: certificado autofirmado o acceso directo por HTTP en local [POR CONFIRMAR]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  api:
    env_file: ../.env.local
    ports:
      - "127.0.0.1:8000:8000"   # acceso directo sin pasar por el proxy, para depuración
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G

  orquestador:
    env_file: ../.env.local
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G

  worker:
    env_file: ../.env.local
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G

  redis:
    env_file: ../.env.local
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  ollama:
    env_file: ../.env.local
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # Modelo (LLM_MODEL_PRINCIPAL) definido en .env.local.
    # [DISCREPANCIA CONFIRMADA 2026-09-24] La máquina real de desarrollo tiene 30.9 GB de RAM
    # total (no 128 GB como documenta el SRS v0.6 §7); Docker Desktop/WSL2 le asigna ~15 GB
    # por defecto (sin tocar .wslconfig para no reiniciar los demás proyectos que corren en
    # esta máquina). gpt-oss:20b no cabe con margen razonable en ese presupuesto: el límite y
    # el modelo por defecto de este overlay se ajustaron a lo que la máquina real soporta.
    # Ver docs/04-pruebas/resultados/local-L1.md.
    deploy:
      resources:
        limits:
          cpus: "8.00"   # subido de 4.00: con 4 el modelo detectaba 16 hilos y sufría
                          # contención severa de CPU (0.06 tokens/s medido, ver local-L1.md)
          memory: 10G   # subido de 6G: 4.7 GB de pesos + ~0.4 GB KV/buffers dejaban <1.5 GB de margen

  qdrant:
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  postgres:
    env_file: ../.env.local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  minio:
    env_file: ../.env.local
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  languagetool:
    ports:
      - "127.0.0.1:8010:8010"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  prometheus:
    profiles: ["observabilidad"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  grafana:
    profiles: ["observabilidad"]
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  langfuse_postgres:
    env_file: ../.env.local
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  langfuse_clickhouse:
    env_file: ../.env.local
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1G

  langfuse:
    env_file: ../.env.local
    ports:
      - "127.0.0.1:3002:3000"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
