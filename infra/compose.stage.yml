# Overlay de ambiente STAGE — usar junto con compose.yml:
#   docker compose --env-file .env.stage -f compose.yml -f compose.stage.yml up -d
# Relacionado con: docs/06-operacion/despliegue-stage-proxmox.md
#
# Solo "proxy" publica un puerto (443); el resto vive en la red interna. Límites de
# recursos dimensionados para la VM stage (ver infra/proxmox/vm-spec.md). Volúmenes
# de datos como bind mount en /srv/agente/ (respaldados por Proxmox Backup Server,
# ver docs/06-operacion/respaldo-y-recuperacion.md).

services:

  proxy:
    env_file: ../.env.stage
    ports:
      - "443:443"
    # TLS: certificado interno de la organización — ver docs/06-operacion/despliegue-stage-proxmox.md §6
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  api:
    env_file: ../.env.stage
    # En stage el almacenamiento es Garage (ADR-006 v2): se reemplaza la lista de
    # dependencias del compose base, que incluye localstack (solo ambiente local).
    depends_on: !override
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      garage:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 2G

  orquestador:
    env_file: ../.env.stage
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 2G

  worker:
    env_file: ../.env.stage
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 2G
      replicas: 2   # RNF-05: ≥ 2 workers en paralelo para procesar ~50 documentos/día en jornada

  worker_indexacion:
    env_file: ../.env.stage
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 2G

  redis:
    env_file: ../.env.stage
    volumes:
      - type: bind
        source: /srv/agente/redis
        target: /data
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1G

  ollama:
    env_file: ../.env.stage
    volumes:
      - type: bind
        source: /srv/agente/ollama
        target: /root/.ollama
    deploy:
      resources:
        limits:
          # Debe coincidir con los vCPU de la VM (hoy 20): Ollama lanza un hilo por vCPU y,
          # si este límite es menor, Docker los pausa en cada ciclo de 100 ms y la IA se
          # vuelve muchas veces más lenta (hallazgo de la prueba de carga del 15/10).
          # Si TI cambia los vCPU de la VM, cambie también este valor.
          cpus: "20"
          # VM de 121 GB: 3 modelos con su contexto caben de sobra; deja memoria al resto.
          memory: 80G

  qdrant:
    volumes:
      - type: bind
        source: /srv/agente/qdrant
        target: /qdrant/storage
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 4G

  postgres:
    env_file: ../.env.stage
    volumes:
      - type: bind
        source: /srv/agente/postgres
        target: /var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 2G

  # LocalStack solo existe en el ambiente local: perdió objetos al reiniciar en stage
  # (ADR-006 v2). El perfil lo deja fuera de `up -d` en stage.
  localstack:
    profiles: ["solo-local"]

  # Almacenamiento de objetos S3 de stage (ADR-006 v2). Sin puertos publicados: la API
  # lo alcanza por red_interna en garage:3900. Configuración: infra/garage/garage.toml.example;
  # inicialización: infra/scripts/inicializar-garage.sh.
  garage:
    image: dxflrs/garage:v1.0.1
    networks:
      - red_interna
    volumes:
      - type: bind
        source: /srv/agente/garage/meta
        target: /var/lib/garage/meta
      - type: bind
        source: /srv/agente/garage/data
        target: /var/lib/garage/data
      - type: bind
        source: /srv/agente/garage/garage.toml
        target: /etc/garage.toml
        read_only: true
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  languagetool:
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1G

  # P-13 (Bloque 2, ADR-009): exporters livianos, sin datos persistentes que
  # respaldar (solo leen y reexponen métricas) -- límites bajos, mismo
  # patrón que el resto de servicios de monitoreo de este archivo.
  node-exporter:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  cadvisor:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  prometheus:
    volumes:
      - type: bind
        source: /srv/agente/prometheus
        target: /prometheus
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1G

  grafana:
    volumes:
      - type: bind
        source: /srv/agente/grafana
        target: /var/lib/grafana
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  langfuse_postgres:
    env_file: ../.env.stage
    volumes:
      - type: bind
        source: /srv/agente/langfuse_postgres
        target: /var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1G

  langfuse_clickhouse:
    env_file: ../.env.stage
    volumes:
      - type: bind
        source: /srv/agente/langfuse_clickhouse
        target: /var/lib/clickhouse
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 2G

  langfuse:
    env_file: ../.env.stage
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1G
