[tool.pytest.ini_options]
# "src" expone comun/ y api/; "src/orquestador" expone el paquete orquestador/
# (anidado a propósito para que `python -m orquestador` funcione igual dentro
# de su propio contexto de build de Docker — ver src/orquestador/Dockerfile).
pythonpath = ["src", "src/orquestador"]
testpaths = ["tests/unit"]
addopts = "--cov=src --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"
# migraciones/versions/: revisiones autogeneradas por `alembic revision --autogenerate`,
# no se mantienen a mano con el mismo estilo que el resto del código.
extend-exclude = [".venv", "src/api/migraciones/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
exclude = ["\\.venv/"]
