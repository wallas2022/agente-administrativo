# Overlay de ambiente LOCAL (desarrollo) — usar junto con compose.yml:
#   docker compose --env-file .env.local -f compose.yml -f compose.local.yml up -d
# Relacionado con: docs/03-diseno/despliegue/estrategia-ambientes.md §4
#
# Puertos publicados solo en 127.0.0.1 (no expuestos a la red), modelo LLM pequeño,
# límites de recursos bajos, volúmenes nombrados (efímeros), perfil "observabilidad" opcional
# para Prometheus/Grafana/Langfuse (docker compose ... --profile observabilidad up -d).
#
# Puertos 8443/5433/9010-9011 (en vez de 443/5432/9000-9001): esta máquina de desarrollo
# ya tiene otros proyectos Docker corriendo que ocupan esos puertos por defecto.

networks:
  red_interna:
    internal: false   # en local SÍ hay internet (para `ollama pull`, `pip install`, etc.);
                       # en stage se mantiene internal: true (RNF-01) — ver compose.stage.yml.

services:

  proxy:
    env_file: ../.env.local
    ports:
      - "127.0.0.1:8443:443"
    # TLS: certificado autofirmado o acceso directo por HTTP en local [POR CONFIRMAR]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  api:
    env_file: ../.env.local
    ports:
      - "127.0.0.1:8000:8000"   # acceso directo sin pasar por el proxy, para depuración
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G

  ui:
    build:
      # VITE_API_BASE_URL debe apuntar a una URL alcanzable desde el NAVEGADOR
      # (que corre en el host, no dentro de la red de Docker), no al nombre
      # de servicio "api" — por eso usa el mismo puerto directo 8000 de arriba.
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "127.0.0.1:5173:5173"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  orquestador:
    env_file: ../.env.local
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G

  worker:
    env_file: ../.env.local
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G

  redis:
    env_file: ../.env.local
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  # [DECISIÓN 2026-09-24, ver docs/04-pruebas/resultados/local-L1.md] La inferencia dentro de
  # Docker Desktop/WSL2 en esta máquina es ~100x más lenta que Ollama nativo de Windows en el
  # mismo hardware (0.06-0.08 tokens/s vs 7.0 tokens/s medidos) — no es un problema de límites
  # de CPU/RAM, es la capa de virtualización. Por eso en LOCAL el motor real es el Ollama nativo
  # del host (LLM_BASE_URL=http://host.docker.internal:11434 en .env.local), no este contenedor.
  # Este servicio se deja arriba pero sin cargar modelos (uso de recursos mínimo) por paridad de
  # stack con stage, donde sí se usa (ahí Docker corre nativo sobre Linux, sin esta penalización).
  ollama:
    env_file: ../.env.local
    # Sin ports: publicar 11434 chocaría con el Ollama nativo de Windows que ya usa ese
    # puerto en el host (y es el que realmente se usa en local, ver nota arriba).
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G

  qdrant:
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  postgres:
    env_file: ../.env.local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  localstack:
    env_file: ../.env.local
    ports:
      - "127.0.0.1:9010:4566"
    volumes:
      - localstack_data:/var/lib/localstack
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  languagetool:
    ports:
      - "127.0.0.1:8010:8010"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  prometheus:
    profiles: ["observabilidad"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  grafana:
    profiles: ["observabilidad"]
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  langfuse_postgres:
    env_file: ../.env.local
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  langfuse_clickhouse:
    env_file: ../.env.local
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1G

  langfuse:
    env_file: ../.env.local
    ports:
      - "127.0.0.1:3002:3000"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
