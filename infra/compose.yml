# Agente Administrativo — servicios base (esqueleto de infraestructura)
# Relacionado con: docs/03-diseno/despliegue/estrategia-ambientes.md, docs/03-diseno/adr/ADR-004-ambientes-local-stage.md
#
# Este archivo declara lo común a todos los ambientes: imágenes, comandos, healthchecks,
# redes y dependencias. NO se usa solo: se combina con un overlay por ambiente.
#   Local:  docker compose --env-file .env.local -f compose.yml -f compose.local.yml up -d
#   Stage:  docker compose --env-file .env.stage -f compose.yml -f compose.stage.yml up -d
# Los overlays agregan puertos, límites de recursos, volúmenes de datos y env_file
# (ver infra/compose.local.yml e infra/compose.stage.yml). Tags de imagen marcados
# "# validar" son una referencia inicial: deben confirmarse antes de un despliegue real.
# Interpolaciones ${VAR} de este archivo se resuelven con --env-file (no con env_file: del contenedor).

networks:
  red_publica:
  red_interna:
    internal: true   # sin salida a internet — ver RNF-01 (docs/01-requerimientos/01-requerimiento-formal.md)

services:

  proxy:
    image: traefik:v3.1   # validar
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.websecure.address=:443"
      - "--ping=true"
      # TLS: certificado y resolver por ambiente — ver overlays y docs/06-operacion/despliegue-stage-proxmox.md §6
    networks:
      - red_publica
      - red_interna
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  api:
    build:
      context: ../src/api
    image: agente-admin/api:0.1.0   # validar
    networks:
      - red_interna
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  orquestador:
    build:
      context: ../src/orquestador
    image: agente-admin/orquestador:0.1.0   # validar
    networks:
      - red_interna
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]   # [POR CONFIRMAR] healthcheck real
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  worker:
    build:
      context: ../src/orquestador
    image: agente-admin/orquestador:0.1.0   # validar — reutiliza la imagen del orquestador
    command: celery -A orquestador worker --loglevel=info   # [POR CONFIRMAR] módulo celery real
    networks:
      - red_interna
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A orquestador inspect ping -t 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine   # validar
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - red_interna
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.34.4   # soporta gpt-oss (verificado en Docker Hub 2026-09-24)
    networks:
      - red_interna
    # Sin GPU confirmada: ejecución en CPU. Modelo por ambiente — ver overlays.
    # Ver docs/03-diseno/adr/ADR-001-motor-llm-cpu.md
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.1   # verificado en Docker Hub 2026-09-24
    networks:
      - red_interna
    healthcheck:
      # La imagen oficial no trae curl/wget; se usa /dev/tcp de bash en su lugar
      # (confirmado en la prueba de humo de docs/04-pruebas/resultados/local-L1.md).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -1 <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:16.4   # validar
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - red_interna
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z   # validar
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    networks:
      - red_interna
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  languagetool:
    image: erikvl87/languagetool:6.5   # validar
    networks:
      - red_interna
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/v2/languages"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.0   # validar
    networks:
      - red_interna
    volumes:
      - ./monitoreo/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.2   # verificado en Docker Hub 2026-09-24
    networks:
      - red_interna
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Langfuse v3: desactivado por defecto (perfil "observabilidad", igual que prometheus/grafana).
  # Usa su PROPIA base de datos (langfuse_postgres) y su propio ClickHouse (langfuse_clickhouse),
  # nunca los de negocio (RNF-01/RNF-02). Reutiliza redis (db 1, distinta de la db 0 de la app)
  # y minio (bucket propio) para no duplicar servicios.
  langfuse_postgres:
    profiles: ["observabilidad"]
    image: postgres:16.4   # validar
    environment:
      POSTGRES_DB: ${LANGFUSE_POSTGRES_DB:-langfuse}
      POSTGRES_USER: ${LANGFUSE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD}
    networks:
      - red_interna
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LANGFUSE_POSTGRES_USER} -d ${LANGFUSE_POSTGRES_DB:-langfuse}"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  langfuse_clickhouse:
    profiles: ["observabilidad"]
    image: clickhouse/clickhouse-server:26.9.1   # verificado en Docker Hub 2026-09-24
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
    networks:
      - red_interna
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://localhost:8123/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  langfuse:
    profiles: ["observabilidad"]
    image: langfuse/langfuse:3.225.11   # verificado en Docker Hub 2026-09-24
    networks:
      - red_interna
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.langfuse.entrypoints=websecure"
      - "traefik.http.services.langfuse.loadbalancer.server.port=3000"
    environment:
      DATABASE_URL: postgresql://${LANGFUSE_POSTGRES_USER}:${LANGFUSE_POSTGRES_PASSWORD}@langfuse_postgres:5432/${LANGFUSE_POSTGRES_DB:-langfuse}
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3002}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      CLICKHOUSE_URL: http://langfuse_clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse_clickhouse:9000
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://:${REDIS_PASSWORD}@redis:6379/1
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
    depends_on:
      langfuse_postgres:
        condition: service_healthy
      langfuse_clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://localhost:3000/api/public/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    # [POR CONFIRMAR] el bucket "langfuse" en MinIO debe crearse antes del primer arranque (ver infra/scripts/)

volumes:
  redis_data:
  ollama_models:
  qdrant_data:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
