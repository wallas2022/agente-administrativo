# Configuración de scraping — Relacionado con: RF-19, RNF-11, docs/06-operacion/monitoreo.md,
# ADR-009 (P-13, Bloque 2).
#
# Los jobs "api"/"orquestador" de versiones anteriores de este archivo
# apuntaban a /metrics -- un endpoint que nunca existió en ninguno de los
# dos servicios (confirmado al revisar el código antes de este bloque).
# ADR-009 decide no exponer un /metrics propio en esta iteración: los
# datos de uso del LLM salen de la tabla `uso_llm` vía la API del
# Dashboard del Administrador (P-13, Bloque 3), no de Prometheus. Si más
# adelante se agrega un /metrics real a algún servicio, su job vuelve acá.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Métricas del host (CPU, memoria, disco) -- P-13 HU-29.
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # Métricas por contenedor (CPU, memoria vs. límite) -- P-13 HU-29.
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # [POR CONFIRMAR] exporters adicionales: postgres_exporter, redis_exporter
